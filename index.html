:root{--camel:#b97838;--sand:#f4ebdd;--card:#fffaf2;--ink:#2b241c;--muted:#796c5c;--line:#ddd1c2;--green:#236c52}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--sand);color:var(--ink)}header{background:var(--camel);color:#fff;padding:max(14px,env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:500;box-shadow:0 1px 0 rgba(0,0,0,.18)}header h1{margin:0;font-size:20px}header small{opacity:.88}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:600;background:rgba(255,250,242,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px}.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;font-weight:700;color:#73685a}.tabs button.active{color:var(--camel)}main{padding:14px 14px 92px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid rgba(130,100,60,.12);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 5px 18px rgba(88,62,33,.06)}.daytitle{font-size:13px;color:var(--camel);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.poirow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.poirow:last-child{border-bottom:0}.poirow b{display:block}.poirow .desc{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74vw}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#efe4d5;color:#5d5144}.visited{background:#dceddf;color:#245b3c}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;background:var(--camel);color:white}.btn.secondary{background:#eee3d4;color:#493f34}.btn.ghost{background:transparent;color:var(--camel);border:1px solid #d7bea1}.controls{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:12px}.mapwrap{height:62vh;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#e7dece}.leaflet-tooltip.poi-label{background:rgba(255,250,242,.92);border:0;box-shadow:0 1px 5px rgba(0,0,0,.16);font-size:10px;font-weight:700;color:#3d3226;padding:2px 5px}.gps{margin-bottom:10px;display:flex;gap:8px;align-items:center}.gpsstatus{font-size:13px;color:var(--muted)}.detail{position:fixed;inset:0;background:var(--sand);z-index:1000;overflow:auto;display:none;padding-bottom:35px}.detail.open{display:block}.detailtop{position:sticky;top:0;z-index:20;background:rgba(244,235,221,.92);backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}.hero{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.detailbody{padding:16px}.names h2{margin:0 0 4px;font-size:27px}.names .en{font-size:14px;color:var(--muted)}.names .ar{font-size:15px;color:var(--muted);direction:rtl;text-align:left;margin-top:2px}.modes{display:flex;gap:8px;margin:16px 0}.modes button{flex:1}.section{white-space:pre-line;line-height:1.58;font-size:16px}.audioBar{position:sticky;bottom:0;background:rgba(255,250,242,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;z-index:25}.audioBar.show{display:block}.audioBar .row{display:flex;gap:8px;align-items:center}.audioBar .row button{flex:0 0 auto}.now{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.flag{height:46px;background:linear-gradient(#ce1126 0 33.33%,#fff 33.33% 66.66%,#000 66.66% 100%);border-radius:14px;margin-bottom:12px}.notice{font-size:13px;background:#fff4d6;border:1px solid #ead79f;border-radius:12px;padding:10px 12px;margin-bottom:12px}.highlight img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:14px;margin-bottom:10px}.highlight h3{margin:3px 0}.highlight p{line-height:1.5;color:#4c4237}.nearest{background:#e8f3ed;border-color:#b8d5c6}.distance{font-variant-numeric:tabular-nums;color:var(--green);font-weight:800;font-size:13px}@media(prefers-color-scheme:dark){:root{--sand:#171512;--card:#24201b;--ink:#f6efe5;--muted:#b9a998;--line:#3c342d}.tabs,.detailtop,.audioBar{background:rgba(32,28,24,.94)}.search{background:#24201b;color:#fff}.pill{background:#3a3128;color:#e8dac9}.notice{background:#3a2f17;border-color:#66592f}.leaflet-tooltip.poi-label{background:rgba(36,32,27,.92);color:#fff}.btn.secondary{background:#3a3128;color:#fff}}</style></head><body><header><h1>Viaggia · Egitto</h1><small>Giza · Saqqara · Dahshur · Cairo</small></header><main><section id="today" class="view active"></section><section id="map" class="view"><div class="gps"><button class="btn" id="gpsBtn">◎ La mia posizione</button><span class="gpsstatus" id="gpsStatus">GPS non attivo</span></div><div id="leafmap" class="mapwrap"></div></section><section id="explore" class="view"><input id="search" class="search" placeholder="Cerca un luogo…"><div id="exploreList"></div></section><section id="trip" class="view"><div class="flag"></div><div class="card"><b>Egitto 2026</b><p>18 settembre: Giza → GEM → Nilo<br>19 settembre: Saqqara → Dahshur → Cairo islamica</p><div class="notice">Per il GPS apri questa pagina via HTTPS in Safari e consenti la posizione. Lo stato “Visitato” resta salvato nel browser.</div></div><div id="gemHighlights"></div></section></main><nav class="tabs"><button data-view="today" class="active">Oggi</button><button data-view="map">Mappa</button><button data-view="explore">Esplora</button><button data-view="trip">Viaggio</button></nav><div id="detail" class="detail"><div class="detailtop"><button id="back" class="btn secondary">← Indietro</button></div><div id="hero" class="hero" style="display:none"></div><div class="detailbody"><div class="names"><h2 id="dName"></h2><div id="dEn" class="en"></div><div id="dAr" class="ar"></div></div><div class="modes"><button class="btn" data-mode="audio">Ascolta</button><button class="btn secondary" data-mode="observe">Osserva</button><button class="btn secondary" data-mode="photo">Fotografa</button></div><div id="section" class="section"></div><div style="margin-top:16px"><button id="visitBtn" class="btn ghost">○ Segna visitato</button></div></div><div id="audioBar" class="audioBar"><div class="row"><button id="playPause" class="btn">▶︎</button><button id="stopAudio" class="btn secondary">■</button><span id="now" class="now"></span></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const POIS=[{"id": "giza-sphinx", "name": "Sfinge di Giza", "en": "Great Sphinx of Giza", "ar": "تمثال أبو الهول بالجيزة", "lat": 29.9753, "lon": 31.1376, "day": "2026-09-18", "area": "Giza", "desc": "Sfinge monumentale dell’altopiano di Giza", "img": "giza-sphinx.jpg", "script": "Fermati un momento prima di avvicinarti ancora. Davanti a te c’è uno dei monumenti più riconoscibili al mondo, ma la Sfinge funziona meglio se la guardi come parte del paesaggio di Giza, non come una statua isolata.\n\nIl corpo di leone e il volto umano sono stati scolpiti direttamente nella roccia dell’altopiano. L’idea è semplice e potentissima: la forza del leone unita all’immagine del sovrano. Le prove archeologiche collegano la Grande Sfinge soprattutto al regno di Chefren, il faraone della seconda grande piramide. Se alzi lo sguardo verso l’altopiano, prova infatti a leggere insieme Sfinge, tempio a valle, strada processionale e piramide: sono elementi dello stesso grande paesaggio funerario.\n\nAvvicinandoti, nota una cosa che nelle fotografie spesso sfugge: la Sfinge non è fatta di blocchi sovrapposti come una piramide. È emersa dalla roccia stessa. Le differenze di durezza negli strati calcarei aiutano anche a spiegare perché alcune parti si siano conservate meglio di altre. Il corpo, lungo e basso, sembra quasi continuare il banco roccioso da cui è stato ricavato.\n\nGuarda poi il volto. Nel corso dei millenni è stato restaurato più volte e il monumento ha attraversato lunghi periodi in cui era parzialmente sommerso dalla sabbia. Già nell’antico Egitto la Sfinge era considerata un monumento remoto e affascinante. Nel Nuovo Regno venne associata al dio solare Horemakhet, “Horus nell’orizzonte”. Tra le zampe anteriori si trova la celebre Stele del Sogno di Thutmosi IV, che racconta il legame del giovane principe con la Sfinge.\n\nPrima di andare via, fai qualche passo lateralmente. Da certe angolazioni vedrai la testa stagliarsi contro la piramide di Chefren. È uno dei punti in cui Giza diventa più chiara: non stai osservando singoli monumenti, ma un’intera scena costruita attorno al potere del faraone, al deserto e all’idea di eternità.\n\nC’è un ultimo dettaglio che vale la pena tenere a mente mentre le passi accanto: il volto che oggi vediamo è il risultato di una lunga storia di erosione, restauri e trasformazioni. Il naso, ormai perduto, è diventato quasi parte del mito moderno della Sfinge, ma il fascino del monumento non dipende da quel dettaglio. Dipende dal modo in cui la figura sembra emergere dal terreno e guardare verso est, verso il sorgere del sole. Se puoi, prova a osservarla per qualche secondo senza fotografare. Da vicino è meno “perfetta” che nelle cartoline, ma proprio le irregolarità della pietra fanno percepire la sua età reale.", "observe": "Osserva il corpo scolpito nella roccia, il volto e il rapporto con il tempio a valle e la piramide di Chefren.", "photo": "Cerca Sfinge e piramide sullo stesso asse; prova anche un dettaglio del volto."}, {"id": "khufu", "name": "Grande Piramide", "en": "Great Pyramid of Giza", "ar": "الهرم الأكبر", "lat": 29.9792, "lon": 31.1342, "day": "2026-09-18", "area": "Giza", "desc": "La più grande piramide di Giza", "img": "khufu.jpg", "script": "Mettiti abbastanza lontano da riuscire a vedere almeno due lati della piramide. La prima impressione è la scala, ma prova a non fermarti a quella. La Grande Piramide è soprattutto una dimostrazione di precisione, organizzazione e capacità di trasformare il paesaggio.\n\nFu costruita per il faraone Cheope, Khufu nelle fonti egizie, e in origine raggiungeva circa 146 metri e mezzo. Per quasi quattromila anni nessun edificio al mondo la superò in altezza. Oggi appare più ruvida e leggermente più bassa perché gran parte del rivestimento esterno in calcare bianco di Tura è scomparso. Immaginala quindi completamente liscia e chiara, capace di riflettere il sole del deserto.\n\nAvvicinati alla base e guarda i blocchi. Da lontano la piramide sembra una forma geometrica perfetta; da vicino torna a essere una montagna di pietra, fatta di migliaia di elementi diversi. È proprio questo cambio di scala a renderla così impressionante. Non conosciamo ogni dettaglio del processo costruttivo, ma sappiamo che fu il risultato di una macchina logistica enorme, fatta di cave, trasporti, artigiani, squadre di lavoro e pianificazione.\n\nSe entrerai all’interno, preparati a un’esperienza molto diversa dall’esterno. I passaggi sono stretti, inclinati e poco spettacolari nel senso tradizionale del termine. Poi, improvvisamente, la Grande Galleria cambia la percezione dello spazio: una salita alta e corbelled, costruita con una precisione sorprendente, conduce verso la Camera del Re. Lì si trova ancora il sarcofago in granito. Non aspettarti pareti dipinte: la forza dell’interno è l’architettura stessa.\n\nPrima di lasciare la piramide, allontanati di nuovo. Cerca la linea della base e il rapporto con il terreno. È facile pensare alla Grande Piramide come a un oggetto astratto, quasi sospeso nella storia. Qui invece puoi sentirne il peso reale: pietra, pendenza, distanza e luce. È questa fisicità, più ancora dei numeri, a far capire perché sia diventata l’ultima superstite delle Sette Meraviglie del mondo antico.\n\nSe ti trovi sul lato orientale, prova anche a pensare a ciò che oggi non domina più il panorama: templi, rampe e strutture di servizio che facevano parte del complesso funerario. La piramide non nacque come un oggetto isolato nel deserto. Era il fulcro di un sistema molto più ampio, collegato al culto del sovrano e alla gestione quotidiana di sacerdoti, offerte e personale. E quando guardi la pendenza perfettamente regolare delle facce, ricorda che quel risultato doveva essere controllato per tutta la costruzione, non soltanto alla fine. È uno dei motivi per cui, ancora oggi, la Grande Piramide colpisce tanto gli archeologi quanto i visitatori.", "observe": "Allontanati per leggere la geometria complessiva, poi avvicinati ai blocchi e alla linea della base.", "photo": "Usa le persone per rendere la scala e prova dettagli dei blocchi."}, {"id": "khafre", "name": "Piramide di Chefren", "en": "Pyramid of Khafre", "ar": "هرم خفرع", "lat": 29.9761, "lon": 31.1308, "day": "2026-09-18", "area": "Giza", "desc": "La seconda grande piramide di Giza", "img": "khafre.jpg", "script": "Guardando Chefren da qui potresti avere l’impressione che sia la piramide più grande di Giza. In realtà è leggermente più bassa della Grande Piramide. L’effetto dipende soprattutto dalla posizione: Chefren è costruita su un terreno più elevato, e questo piccolo vantaggio topografico cambia completamente la percezione.\n\nLa caratteristica più facile da riconoscere è in alto. Alla sommità si conserva ancora una parte del rivestimento originario in calcare chiaro, la superficie liscia che un tempo copriva quasi tutta la piramide. È un dettaglio prezioso perché ti permette di immaginare come apparissero questi monumenti prima che gran parte dei blocchi di rivestimento fosse rimossa e riutilizzata.\n\nOra prova a pensare alla piramide non come a un edificio solitario. Il complesso di Chefren comprendeva il tempio funerario accanto alla piramide, una lunga strada processionale e il tempio a valle, vicino alla Sfinge. Proprio il rapporto fra questi elementi è uno dei motivi per cui il complesso di Chefren è così importante. Alcune delle sue strutture sono fra le meglio conservate dell’Antico Regno.\n\nSe hai già visto la Sfinge, collega mentalmente i due monumenti. Le evidenze archeologiche indicano una forte relazione con il complesso di Chefren. Questa vicinanza cambia anche il modo di guardare la piramide: non è solo una massa geometrica, ma il punto dominante di un percorso rituale che saliva dal margine fertile della valle verso il deserto e la tomba reale.\n\nPrima di proseguire, cerca un punto in cui puoi vedere insieme Chefren e Cheope. Nota come bastino pochi metri di differenza nel terreno e nella posizione per alterare la loro apparente grandezza. È una buona lezione per tutta Giza: qui ciò che percepiamo dipende continuamente dal punto di vista. Muoversi nello spazio è parte della visita tanto quanto conoscere i nomi dei faraoni.\n\nAvvicinandoti alla base, osserva anche quanto la superficie cambi con la luce. I blocchi che da lontano sembrano uniformi rivelano giunti, restauri e differenze di lavorazione. Se il sole è alto, la parte di rivestimento rimasta in cima può quasi scomparire contro il cielo; con una luce più laterale, invece, la distinzione fra nucleo e rivestimento diventa molto più evidente. È un piccolo esercizio utile per tutto il sito: a Giza la luce non illumina soltanto i monumenti, ma cambia il modo in cui li leggi.", "observe": "Cerca il rivestimento chiaro ancora conservato in cima e confronta la quota con Cheope.", "photo": "Una vista laterale rende bene il confronto con Cheope e il rivestimento in cima."}, {"id": "menkaure", "name": "Piramide di Micerino", "en": "Pyramid of Menkaure", "ar": "هرم منكاورع", "lat": 29.9725, "lon": 31.1283, "day": "2026-09-18", "area": "Giza", "desc": "La più piccola piramide principale di Giza", "img": "menkaure.jpg", "script": "Dopo Cheope e Chefren, la piramide di Micerino cambia immediatamente la scala del paesaggio. È molto più piccola: in origine raggiungeva circa 65 metri. Ma sarebbe un errore considerarla semplicemente una versione ridotta delle altre due.\n\nGuarda soprattutto la parte inferiore. Micerino scelse di utilizzare granito per una parte del rivestimento esterno, un materiale molto più duro del calcare e proveniente da Assuan, a centinaia di chilometri di distanza. Alcuni blocchi alla base mostrano ancora questa scelta costruttiva e raccontano uno sforzo logistico notevole. Più in alto il rivestimento sarebbe invece continuato in calcare.\n\nLa dimensione più contenuta della piramide non significa quindi necessariamente minore ambizione. Anzi, il complesso mostra un’attenzione diversa ai materiali e agli edifici rituali. Intorno alla piramide principale si trovano anche piramidi minori che aiutano a leggere il complesso come un insieme e non come un singolo monumento.\n\nSe visiterai l’interno, aspettati di nuovo un forte contrasto con l’esterno. Dalla luce del deserto si entra in corridoi e camere dove l’esperienza è fatta soprattutto di proporzioni, pendenza e silenzio. Non serve trasformare la visita in una prova di resistenza: se hai già visitato l’interno di Cheope, puoi decidere sul posto se vuoi confrontare i due spazi o conservare energie per il resto dell’altopiano.\n\nAll’esterno, fai invece qualche passo verso le piramidi satelliti e voltati. Da qui Micerino acquista più presenza e puoi includere nel campo visivo anche Chefren e Cheope. È uno dei punti migliori per capire che le tre piramidi non sono semplicemente tre triangoli allineati, ma tre complessi costruiti in momenti diversi e con scelte diverse, all’interno dello stesso straordinario paesaggio funerario.", "observe": "Confronta la scala con le altre piramidi e guarda il granito alla base.", "photo": "Cerca una prospettiva con le piramidi satelliti e il granito alla base."}, {"id": "meresankh", "name": "Tomba di Meresankh III", "en": "Tomb of Queen Meresankh III", "ar": "مقبرة الملكة مرس عنخ الثالثة", "lat": 29.9783, "lon": 31.1374, "day": "2026-09-18", "area": "Giza", "desc": "Tomba decorata della regina Meresankh III", "img": "meresankh.jpg", "script": "Entrare nella tomba di Meresankh III significa cambiare completamente scala. Fuori hai appena camminato fra piramidi gigantesche; qui invece la storia passa attraverso figure, gesti e dettagli sulle pareti.\n\nMeresankh III apparteneva al cuore della famiglia reale della Quarta Dinastia: era nipote di Cheope e moglie di Chefren. La sua tomba, nella necropoli orientale di Giza, conserva alcuni dei rilievi meglio preservati di questa parte del sito.\n\nNon cercare di leggere ogni scena. Scegline alcune e soffermati. Vedrai attività apparentemente quotidiane: preparazione del pane e della birra, allevamento, caccia agli uccelli, lavorazione dei metalli, produzione di oggetti. Queste immagini non erano semplici decorazioni. Nel mondo funerario egizio contribuivano a garantire simbolicamente alla defunta ciò che sarebbe servito nell’aldilà: cibo, beni, lavoro e continuità.\n\nOsserva anche le differenze di scala fra le figure. Le dimensioni non rispondono sempre a una prospettiva realistica: spesso indicano importanza e gerarchia. Chi conta di più può essere rappresentato più grande, mentre servitori e lavoratori occupano registri più piccoli e affollati.\n\nUno dei dettagli più memorabili della tomba è il gruppo di grandi figure femminili scolpite direttamente nella parete settentrionale. Sono dieci statue e vengono interpretate come rappresentazioni della regina, della madre e delle figlie. È un momento particolarmente efficace perché la parete smette quasi di essere superficie e diventa presenza fisica.\n\nMuoviti lentamente, soprattutto se lo spazio è affollato. Qui la visita funziona meglio a distanza ravvicinata: guarda le mani, gli strumenti, gli animali e le tracce di colore. Dopo l’enorme astrazione delle piramidi, Meresankh restituisce persone e attività. È proprio questo contrasto a rendere la tappa così interessante.", "observe": "Segui figure, rilievi e differenze di scala nelle scene interne.", "photo": "Privilegia dettagli leggibili dei rilievi, rispettando le regole del sito."}, {"id": "giza-panorama", "name": "Panorama delle piramidi", "en": "Giza Pyramids Panorama", "ar": "بانوراما الأهرامات", "lat": 29.9695, "lon": 31.1219, "day": "2026-09-18", "area": "Giza", "desc": "Belvedere sulle tre grandi piramidi", "img": "khufu.jpg", "script": "Questo è il momento per smettere di guardare un monumento alla volta. Fermati e lascia che l’altopiano diventi un’unica scena.\n\nDa una posizione panoramica puoi confrontare Cheope, Chefren e Micerino senza essere schiacciato dalla loro scala. Nota subito che le piramidi non formano una semplice fila perfetta. Ognuna occupa il proprio spazio, con templi, strade processionali, piramidi minori e necropoli distribuite attorno.\n\nCerca poi il confine fra deserto e città. Giza viene spesso fotografata come se fosse isolata nel Sahara, ma il Cairo moderno arriva molto vicino al sito. Questo contrasto è parte dell’esperienza contemporanea: da un lato uno dei paesaggi archeologici più famosi del mondo, dall’altro una metropoli enorme che continua a vivere attorno ad esso.\n\nSpostati di qualche metro e osserva come cambiano le sovrapposizioni. Una piramide può sembrare più grande o più piccola soltanto perché cambia il punto di vista. Chefren, costruita su terreno più alto, è l’esempio più evidente. Il panorama ti permette quindi di leggere non solo gli edifici ma anche la topografia.\n\nPrima di ripartire, prenditi un minuto senza fotografare. Prova a immaginare le superfici originarie più lisce e luminose, i complessi templari più completi e le processioni che attraversavano questo spazio. Poi torna al presente. Il valore del panorama è proprio questo: riunisce in un solo sguardo architettura, geografia e tempo.", "observe": "Muoviti lateralmente finché i profili delle tre piramidi risultano ben separati.", "photo": "Sposta il punto di ripresa per evitare sovrapposizioni tra le piramidi."}, {"id": "gem", "name": "Grand Egyptian Museum", "en": "Grand Egyptian Museum", "ar": "المتحف المصري الكبير", "lat": 29.9934, "lon": 31.1192, "day": "2026-09-18", "area": "GEM", "desc": "Il grande museo dell’antico Egitto", "img": "gem.jpg", "script": "Dopo il paesaggio aperto di Giza, il Grand Egyptian Museum cambia completamente il modo di incontrare l’Egitto antico. Qui non devi misurarti con un monumento immobile nel deserto, ma con migliaia di oggetti raccolti, ordinati e messi in relazione.\n\nIl consiglio più importante è semplice: non provare a vedere tutto con la stessa intensità. Il museo è enorme. Scegli alcuni fili conduttori e lascia che siano gli oggetti a rallentarti.\n\nGià nell’area d’ingresso, il colosso di Ramses II e la scala dell’architettura preparano il passaggio fra antico e contemporaneo. La grande scalinata non è soltanto un collegamento fra piani: funziona come una sequenza di opere monumentali. Salendo, fermati ogni tanto e voltati. Le prospettive cambiano continuamente e in alcuni punti il rapporto visivo con l’altopiano di Giza diventa parte stessa dell’esperienza.\n\nNelle gallerie principali evita di inseguire soltanto gli oggetti più famosi. Guarda materiali e dimensioni: pietra, legno, metallo, oggetti minuscoli e statue monumentali raccontano aspetti molto diversi della stessa civiltà. Una didascalia letta bene vale più di dieci vetrine attraversate in fretta.\n\nLe gallerie di Tutankhamon sono inevitabilmente uno dei momenti centrali. Oltre ai capolavori più celebri, prova però a cercare oggetti che riportano il giovane faraone a una dimensione più concreta: arredi, strumenti, oggetti personali, elementi della vita di corte. È lì che una figura quasi mitica torna a sembrare una persona vissuta davvero.\n\nAnche le barche di Cheope sono un ottimo ponte con ciò che hai visto fuori. Osservandone la struttura puoi collegare il museo alla Grande Piramide e ricordare che il complesso funerario comprendeva molto più della sola piramide.\n\nUsa questa visita come un cambio di ritmo: meno chilometri, più selezione. Quando un oggetto ti incuriosisce, resta lì qualche minuto. Il museo funziona meglio quando smette di essere una lista di cose da spuntare e diventa una serie di incontri.\n\nUn buon modo per non farti sopraffare è scegliere alcuni oggetti e guardarli davvero. Prova a chiederti non soltanto “quanto è antico?”, ma anche “come veniva usato, chi poteva toccarlo, dove si trovava originariamente?”. Quando un oggetto viene separato dalla sua vetrina e ricollocato mentalmente in una tomba, in un tempio o in una casa, il museo cambia ritmo. E se una sala è troppo affollata, passa oltre: il GEM è abbastanza grande da permetterti di costruire una visita personale senza inseguire ogni capolavoro.", "observe": "Lascia che architettura e reperti dialoghino: alterna viste ampie e dettagli.", "photo": "Cerca geometrie, scale e contrasti fra architettura contemporanea e reperti."}, {"id": "zamalek", "name": "Nilo — Zamalek", "en": "Nile — Zamalek", "ar": "النيل — الزمالك", "lat": 30.0587, "lon": 31.2182, "day": "2026-09-18", "area": "Cairo", "desc": "Isola sul Nilo per passeggiata e tramonto", "img": "zamalek.jpg", "script": "Dopo una giornata fra pietra, sabbia e sale museali, il Nilo cambia il ritmo. Qui non serve cercare un monumento preciso. Lascia che sia il movimento dell’acqua a rimettere insieme il Cairo.\n\nIl fiume è la ragione geografica profonda per cui questa civiltà è nata e ha prosperato. Per millenni le sue piene, i campi coltivati lungo le rive e la navigazione hanno collegato territori molto distanti. Oggi il Cairo è una metropoli completamente diversa, ma il Nilo continua a essere il suo asse visivo più potente.\n\nSe sei a Zamalek, guarda prima le due rive. Ponti, torri, alberghi, barche e palazzi compongono una città molto più moderna di quella che hai incontrato nei siti archeologici. Poi abbassa lo sguardo verso l’acqua: il contrasto fra traffico urbano e lentezza del fiume è forse il modo migliore per chiudere la giornata.\n\nSe sali su una feluca, non serve cercare una spiegazione continua. Questo è uno dei momenti in cui l’audioguida può anche tacere. Guarda la luce cambiare sui palazzi e sulle barche, ascolta i rumori della città che diventano più lontani e prova a seguire la forma delle rive.\n\nAl tramonto il fiume diventa soprattutto una questione di riflessi e silhouette. È un Cairo diverso da quello delle piramidi, ma non meno importante: una città viva, stratificata, che continua a organizzarsi attorno alla stessa presenza d’acqua che ha accompagnato tutta la storia dell’Egitto.", "observe": "Guarda il rapporto fra acqua, ponti, barche e skyline del Cairo.", "photo": "Al tramonto cerca riflessi, barche e livelli sovrapposti dello skyline."}, {"id": "djoser", "name": "Piramide di Djoser", "en": "Step Pyramid of Djoser", "ar": "هرم زوسر المدرج", "lat": 29.87127, "lon": 31.21639, "day": "2026-09-19", "area": "Saqqara", "desc": "La celebre piramide a gradoni di Saqqara", "img": "djoser.jpg", "script": "Prima di concentrarti sulla piramide, guarda il complesso nel suo insieme. Saqqara è più antica e più sperimentale di Giza, e qui si vede uno dei momenti in cui l’architettura egizia cambia davvero direzione.\n\nLa Piramide a Gradoni fu costruita per il re Djoser, chiamato anche Netjerykhet, durante la Terza Dinastia. Il nome più famoso legato al progetto è quello di Imhotep, figura che la tradizione successiva avrebbe ricordato come architetto e uomo di straordinario sapere.\n\nLa cosa importante è capire che questa piramide non nacque già nella forma che vedi. Il progetto crebbe per fasi. Alla base c’era il principio della mastaba, la tomba rettangolare utilizzata dalle élite. Sovrapponendo e ampliando progressivamente queste strutture, il monumento arrivò a sei gradoni. È per questo che Djoser rappresenta un passaggio fondamentale fra le tombe precedenti e le piramidi a facce lisce che incontrerai poi a Dahshur e Giza.\n\nAvvicinandoti, osserva anche gli edifici del complesso. Molte forme in pietra imitano elementi che in precedenza venivano realizzati con materiali più leggeri e deperibili, come legno e fasci vegetali. È quasi come se gli architetti avessero voluto trasformare in pietra un mondo architettonico già conosciuto, rendendolo però permanente.\n\nLa camera funeraria si trova molto più in basso, alla base di un profondo pozzo centrale. L’interno è un sistema complesso di passaggi e ambienti sotterranei. Se visiterai la piramide, nota quanto l’esperienza cambi: all’esterno l’edificio è una montagna ordinata in gradini; all’interno prevalgono discesa, compressione e orientamento.\n\nPrima di andare avanti, girati verso il deserto. Djoser non è importante soltanto perché è “la prima piramide”. È importante perché qui puoi vedere l’architettura mentre sta imparando a diventare monumentale. Quello che a Giza appare perfetto e inevitabile, qui è ancora un’idea in evoluzione.\n\nMentre ti muovi nel complesso, prova a notare un’altra cosa: molte forme in pietra imitano materiali più antichi e leggeri, come legno, canne e stuoie. È come se gli architetti avessero preso un linguaggio costruttivo già familiare e lo avessero congelato nella pietra per renderlo eterno. Questa scelta spiega perché alcuni dettagli sembrino quasi decorativi o “troppo sottili” per essere pura struttura. Djoser è importante proprio per questo: non è soltanto la prima grande piramide a gradoni, ma un laboratorio in cui l’architettura egizia scopre quanto può essere espressiva la pietra.", "observe": "Leggi i sei gradoni e poi le architetture del complesso alla base.", "photo": "Vista laterale per i gradoni; poi dettagli di colonne, cortili e pietra."}, {"id": "mereruka", "name": "Tomba di Mereruka", "en": "Tomb of Mereruka", "ar": "مقبرة مريروكا", "lat": 29.87579, "lon": 31.2212, "day": "2026-09-19", "area": "Saqqara", "desc": "Grande mastaba decorata dell’Antico Regno", "img": "mereruka.jpg", "script": "La tomba di Mereruka è uno dei luoghi migliori di Saqqara per dimenticare per qualche minuto i faraoni e guardare invece la società che ruotava attorno a loro.\n\nMereruka fu visir durante il regno di Teti, all’inizio della Sesta Dinastia. Il visir era uno dei funzionari più potenti del paese, e la dimensione della sua mastaba lo dimostra: il complesso comprende circa trenta ambienti, alcuni destinati anche alla moglie e al figlio.\n\nEntrando, non provare a seguire ogni parete in ordine. Cerca piuttosto le scene che sembrano più vive. Potresti trovare animali, pesca, caccia agli uccelli, allevamento, offerte e lavori agricoli. Sono immagini preziose perché, mentre avevano una funzione funeraria, ci restituiscono anche frammenti di attività quotidiane dell’Antico Regno.\n\nGuarda il modo in cui gli artisti raccontano il movimento. Gli animali possono essere sorprendentemente dinamici, mentre le figure umane sono organizzate secondo regole precise. Le dimensioni delle persone cambiano con il loro ruolo, e le scene vengono distribuite in registri che permettono di raccontare molte azioni nello stesso spazio.\n\nUno dei punti più importanti è la falsa porta. Nel culto funerario rappresentava una soglia simbolica attraverso cui il defunto poteva ricevere le offerte. Nella tomba di Mereruka la presenza della statua a grandezza naturale rende questa idea particolarmente immediata: la figura sembra emergere dal mondo della tomba verso quello dei vivi.\n\nFai attenzione anche alla qualità del rilievo. Avvicinati quanto consentito e guarda come pochi millimetri di profondità bastino a definire muscoli, piume, strumenti e tessuti. È un tipo di monumentalità completamente diverso dalla piramide di Djoser: non nasce dalla massa, ma dalla densità dei dettagli.", "observe": "Cerca scene di pesca, caccia, allevamento e vita quotidiana.", "photo": "Dettagli delle scene e profondità dei corridoi, senza flash dove vietato."}, {"id": "mehu", "name": "Tomba di Mehu", "en": "Tomb of Mehu", "ar": "مقبرة ميحو", "lat": 29.8724, "lon": 31.2194, "day": "2026-09-19", "area": "Saqqara", "desc": "Tomba decorata di un alto funzionario", "img": "mehu.jpg", "script": "Nella tomba di Mehu lascia che siano le scene a guidarti. Mehu fu un alto funzionario e visir della Sesta Dinastia, e la sua tomba conserva una decorazione particolarmente vivace.\n\nGuarda le pareti come se fossero una sequenza di piccoli racconti. Troverai raccolti agricoli, pesca con le reti, barche, lavorazione dei metalli, offerte, giardini, preparazione del pane e della birra. In alcune scene compaiono anche musicisti e danzatori. Tutto questo aveva una funzione precisa: assicurare simbolicamente al defunto la continuità delle risorse e delle attività necessarie nell’aldilà.\n\nMa non serve conoscere ogni significato religioso per apprezzare quello che hai davanti. Concentrati sui dettagli più umani: una postura, un gesto di lavoro, un animale, il ritmo delle figure. È proprio questa ricchezza a rendere le tombe private complementari alle grandi piramidi. Le piramidi raccontano il potere attraverso la scala; queste pareti raccontano un mondo attraverso le azioni.\n\nSe la luce è bassa, lascia che gli occhi si adattino prima di fotografare o passare oltre. I colori e i rilievi diventano più leggibili dopo qualche secondo. Cerca anche le parti meno spettacolari: spesso una scena piccola e ben conservata può essere più interessante di una parete intera.\n\nQuando uscirai di nuovo nel sole di Saqqara, prova a conservare questa immagine: dietro le geometrie monumentali dell’Antico Regno c’era una società fatta di mestieri, cibo, musica, animali e movimento. Mehu è uno dei posti in cui tutto questo torna sorprendentemente vicino.", "observe": "Confronta scene di lavoro, animali e figure umane.", "photo": "Cerca dettagli di colore e luce, rispettando sempre le indicazioni del sito."}, {"id": "nobles-tombs", "name": "Tombe dei nobili", "en": "Tombs of the Nobles", "ar": "مقابر النبلاء", "lat": 29.8758, "lon": 31.2212, "day": "2026-09-19", "area": "Saqqara", "desc": "Mastabe decorate dei nobili di Saqqara", "img": "mereruka.jpg", "script": "Le tombe dei nobili di Saqqara non sono una singola attrazione, ma un insieme di ambienti che possono cambiare in base alle aperture del giorno. È quindi meglio affrontarle con un obiettivo semplice: scegli poche tombe e guarda bene ciò che trovi.\n\nQui l’attenzione si sposta dalla tomba reale alle élite amministrative che gestivano lo Stato. Funzionari, sacerdoti e membri importanti della società costruivano mastabe decorate con scene legate alla vita, alle offerte e alla continuità nell’aldilà.\n\nQuando entri in una tomba, osserva prima l’organizzazione generale della parete. Poi avvicinati ai dettagli. Le figure sono spesso disposte in registri orizzontali e le dimensioni cambiano in base all’importanza sociale. È un linguaggio visivo che non cerca la prospettiva realistica a cui siamo abituati, ma vuole rendere immediatamente leggibili ruoli e azioni.\n\nCerca una scena che ti incuriosisce e seguila dall’inizio alla fine: agricoltura, pesca, artigianato, offerte, animali. Invece di passare velocemente da una stanza all’altra, prova a capire come l’artista abbia organizzato quella singola storia.\n\nÈ anche un buon posto per notare quanto il colore residuo possa cambiare una superficie. L’immagine dell’Egitto antico come un mondo di pietra beige è in gran parte un effetto del tempo. Dove i pigmenti sopravvivono, le scene diventano molto più vive.\n\nQuando torni all’aperto, confronta mentalmente queste tombe con Djoser. La distanza fisica è piccola, ma il modo di rappresentare la memoria è completamente diverso: là un’enorme forma architettonica; qui stanze piene di immagini. Entrambe cercavano, a modo loro, di far durare una presenza oltre la vita.", "observe": "Osserva come dimensione e posizione delle figure esprimono gerarchia.", "photo": "Scegli una singola scena e costruisci l’immagine attorno ad essa."}, {"id": "new-kingdom-tombs", "name": "Tombe del Nuovo Regno", "en": "New Kingdom Cemetery", "ar": "مقابر الدولة الحديثة", "lat": 29.8685, "lon": 31.2175, "day": "2026-09-19", "area": "Saqqara", "desc": "Tombe monumentali del Nuovo Regno", "img": "djoser.jpg", "script": "Questa zona di Saqqara è particolarmente interessante perché rompe l’idea che il sito appartenga soltanto all’età delle piramidi. Molti secoli dopo Djoser e i grandi sovrani dell’Antico Regno, Saqqara continuava a essere un luogo prestigioso per le sepolture.\n\nLe tombe del Nuovo Regno che incontri qui appartenevano a importanti funzionari vissuti fra la Diciottesima e la Ventesima Dinastia. Fra i nomi legati alla zona ci sono Maya, tesoriere di Tutankhamon, Tia, alto funzionario sotto Ramses II, e Horemheb, che preparò qui una tomba quando era ancora generale prima di diventare faraone.\n\nGuarda soprattutto l’architettura. Queste tombe non sono mastabe come quelle dell’Antico Regno. Le cappelle funerarie emergono come strutture indipendenti e possono ricordare piccoli templi, con cortili, piloni e cappelle. In alcuni casi una piccola piramide sormontava la parte centrale come simbolo di rinascita.\n\nQuesta differenza è utile perché rende visibile il passare del tempo senza bisogno di una cronologia dettagliata. Cammini nello stesso sito, ma il linguaggio architettonico è cambiato. Saqqara funziona quasi come una città dei morti cresciuta per strati.\n\nSe trovi pannelli o ricostruzioni, usali per immaginare le parti mancanti. Molte opere provenienti da quest’area furono rimosse nel XIX secolo prima che gli scavi fossero documentati con criteri moderni, e oggi alcuni rilievi e statue sono dispersi in musei e collezioni.\n\nPrima di lasciare la zona, voltati verso il resto della necropoli. È uno dei momenti in cui Saqqara mostra meglio la sua profondità temporale: davanti a te non c’è un solo periodo storico, ma quasi tremila anni di riuso, memoria e trasformazione.", "observe": "Confronta architettura e decorazioni con le mastabe dell’Antico Regno.", "photo": "Usa cortili e passaggi per costruire profondità e prospettiva."}, {"id": "imhotep-museum", "name": "Museo Imhotep", "en": "Imhotep Museum", "ar": "متحف إيمحتب", "lat": 29.873, "lon": 31.2253, "day": "2026-09-19", "area": "Saqqara", "desc": "Museo introduttivo dedicato a Saqqara", "img": "imhotep-museum.jpg", "script": "Il Museo Imhotep è una buona pausa fra una visita all’aperto e l’altra. Non pensarlo come un museo da attraversare in modo sistematico: usalo piuttosto per mettere ordine in quello che hai appena visto a Saqqara.\n\nIl museo porta il nome di Imhotep, la figura associata alla progettazione del complesso funerario di Djoser e alla grande svolta verso l’architettura monumentale in pietra. Nelle sale troverai reperti provenienti da diverse zone della necropoli: statue, elementi architettonici, sarcofagi, oggetti funerari e materiali emersi dagli scavi.\n\nScegli alcuni pezzi e prova a collegarli al paesaggio esterno. Dopo aver camminato fra piramidi e mastabe, vedere un frammento, uno strumento o un elemento decorativo da vicino cambia la scala della storia. Saqqara smette di essere soltanto un insieme di monumenti e torna a essere un luogo scavato, studiato e ricostruito nel tempo.\n\nUna parte del museo ricorda anche il lavoro degli archeologi e dei restauratori che hanno dedicato anni al complesso di Djoser. È un promemoria utile: ciò che oggi appare come un sito archeologico leggibile è il risultato non solo degli antichi costruttori, ma anche di generazioni di ricerca moderna.\n\nNon serve rimanere qui troppo a lungo se hai ancora molte tappe. Cerca invece due o tre oggetti che vuoi ricordare e poi torna all’esterno. Il museo funziona bene come lente: dopo la visita, dettagli che prima sembravano secondari nei monumenti possono diventare improvvisamente più chiari.", "observe": "Collega i reperti esposti ai monumenti che hai appena visto all’esterno.", "photo": "Evita i riflessi sulle vetrine e fotografa solo dove consentito."}, {"id": "serapeum", "name": "Serapeum", "en": "Serapeum of Saqqara", "ar": "السرابيوم", "lat": 29.87602, "lon": 31.21022, "day": "2026-09-19", "area": "Saqqara", "desc": "Gallerie sotterranee dei tori Apis", "img": "serapeum.jpg", "script": "Prima di scendere, fermati un attimo all’ingresso. Fra poco passerai dalla luce aperta del deserto a uno degli ambienti più insoliti di Saqqara: una rete di gallerie sotterranee costruite per le sepolture dei tori Apis.\n\nNell’antica Menfi il toro Apis era considerato una manifestazione vivente del dio Ptah. Non si trattava quindi di un animale qualunque. In un dato momento esisteva un solo Apis riconosciuto, e alla sua morte riceveva onori funerari straordinari prima che venisse individuato il successore.\n\nLe gallerie del Serapeum furono utilizzate per secoli, dal Nuovo Regno fino all’epoca tolemaica. Camminando all’interno, lascia che sia la scala a sorprenderti. I grandi sarcofagi in pietra sono massicci, scuri e perfettamente inseriti negli spazi laterali. È difficile percepirne il peso reale soltanto guardandoli, ma basta confrontarli con una persona vicina per rendersi conto delle dimensioni.\n\nOsserva anche la qualità delle superfici. In un ambiente sotterraneo, con luce controllata e corridoi ripetitivi, piccoli cambiamenti di texture diventano molto evidenti. Non avere fretta di arrivare in fondo. Fermati in uno dei punti in cui la prospettiva delle gallerie è più lunga e guarda come le aperture laterali scandiscono lo spazio.\n\nIl Serapeum funziona molto bene anche come contrasto con il resto di Saqqara. Fuori, le piramidi cercano l’orizzonte e il cielo. Qui tutto è interno, pesante, compresso e silenzioso. È la stessa necropoli, ma con un’esperienza fisica quasi opposta.\n\nQuando torni verso l’uscita, nota quanto rapidamente cambia la luce. Dopo alcuni minuti sottoterra, il deserto sembra più brillante del normale. È un finale semplice ma efficace: la visita non riguarda soltanto ciò che hai imparato, ma il passaggio concreto fra due ambienti completamente diversi.\n\nSe ti chiedi come siano stati portati qui sarcofagi così grandi, non aspettarti una risposta semplice. Il trasporto e la collocazione di blocchi di questa massa richiedevano una pianificazione eccezionale, e il risultato è ancora più impressionante perché tutto avviene sottoterra, in spazi relativamente controllati. Non serve immaginare misteri: basta osservare la precisione con cui i sarcofagi sono stati sistemati nelle camere laterali. È un buon promemoria di quanto l’organizzazione tecnica egizia potesse essere sofisticata anche lontano dalle grandi piramidi.", "observe": "Nota il passaggio dalla luce del deserto alle gallerie e la scala dei sarcofagi.", "photo": "Cerca simmetrie, profondità e scala dei sarcofagi nella luce disponibile."}, {"id": "bent-pyramid", "name": "Piramide Romboidale", "en": "Bent Pyramid", "ar": "الهرم المنحني", "lat": 29.79028, "lon": 31.20917, "day": "2026-09-19", "area": "Dahshur", "desc": "Piramide dal caratteristico cambio d’inclinazione", "img": "bent-pyramid.jpg", "script": "Guardala da una certa distanza prima di avvicinarti. La Piramide Romboidale racconta la propria storia direttamente attraverso la forma: a metà altezza la pendenza cambia in modo evidente.\n\nFu costruita per Snefru, il primo sovrano della Quarta Dinastia. La parte inferiore iniziò con un’inclinazione molto ripida, circa 55 gradi. Durante la costruzione il progetto venne modificato e la parte superiore proseguì con un angolo più dolce, intorno ai 43 gradi. Il risultato è quella silhouette spezzata che le ha dato il nome moderno.\n\nLa cosa interessante non è pensare a questo come a un semplice “errore”. È molto più utile vederlo come una fase di sperimentazione. Gli architetti egizi stavano cercando di passare dalle piramidi a gradoni, come quella di Djoser, alle grandi piramidi a facce lisce. Dahshur ti permette di vedere questa evoluzione quasi in sequenza.\n\nGuarda anche il rivestimento esterno. La Piramide Romboidale conserva ancora grandi porzioni del calcare liscio che originariamente ricopriva le piramidi. Questo la rende particolarmente preziosa per immaginare l’aspetto antico di monumenti che oggi vediamo quasi sempre con il nucleo più ruvido esposto.\n\nUn’altra particolarità sono i due ingressi, uno sul lato nord e uno più in alto sul lato occidentale, collegati a sistemi interni distinti. Se l’accesso è aperto e decidi di entrare, preparati a passaggi inclinati e spazi che richiedono una certa energia. Non è indispensabile farlo per capire il monumento: anche dall’esterno la sua storia architettonica è chiarissima.\n\nPrima di spostarti verso la Piramide Rossa, guarda ancora una volta il cambio di pendenza. Fra poco vedrai il passo successivo: una piramide costruita con un’unica inclinazione più prudente. Dahshur è quasi un manuale di architettura a grandezza naturale.\n\nDa vicino, il cambio di inclinazione è meno “grafico” di quanto sembri nelle fotografie, perché l’occhio viene assorbito dalla scala della muratura. Per questo vale la pena alternare due distanze: prima guardala da vicino, poi allontanati di nuovo. Noterai come la forma complessiva diventi leggibile soltanto quando il monumento rientra interamente nel campo visivo. È uno dei rari casi in cui una decisione tecnica presa durante la costruzione è rimasta visibile, gigantesca, per più di quattro millenni.", "observe": "Concentrati sul cambio d’angolo e sul rivestimento ancora conservato.", "photo": "Usa una persona per la scala e scegli un punto che faccia leggere il cambio di pendenza."}, {"id": "red-pyramid", "name": "Piramide Rossa", "en": "Red Pyramid", "ar": "الهرم الأحمر", "lat": 29.80888, "lon": 31.20611, "day": "2026-09-19", "area": "Dahshur", "desc": "Grande piramide liscia di Snefru", "img": "red-pyramid.jpg", "script": "Dopo la forma spezzata della Piramide Romboidale, la Piramide Rossa sembra quasi una risposta. Le sue facce salgono con un’inclinazione uniforme e controllata: qui il progetto della piramide a pareti lisce raggiunge una forma molto più stabile.\n\nAnche questa fu costruita per Snefru. È una delle più grandi piramidi d’Egitto, superata in dimensioni soltanto da Cheope e Chefren a Giza. Il nome moderno deriva dal colore rossastro della pietra oggi esposta, ma in origine l’esterno era rivestito di calcare bianco di Tura, come le altre grandi piramidi.\n\nFermati alla base e guarda quanto la pendenza sia più dolce rispetto a Giza. Questa scelta è probabilmente legata proprio alle esperienze precedenti. Qui non hai davanti un monumento improvvisato, ma il risultato di una fase di apprendimento tecnico estremamente ambiziosa.\n\nSe entri, l’accesso dal lato nord conduce a un lungo corridoio discendente. Gli ambienti interni sono celebri per i soffitti a falsa volta, costruiti facendo sporgere progressivamente i blocchi verso il centro. Guardando verso l’alto, la geometria crea un effetto quasi astratto. I passaggi sono stretti e l’aria può essere pesante: prenditi il tuo tempo e non trasformare l’esperienza in una corsa.\n\nAll’esterno, allontanati abbastanza da isolare la piramide contro il cielo. Dahshur è meno congestionata di Giza e questo rende più facile percepire il monumento come parte del deserto. Qui il valore della visita non è soltanto vedere un’altra piramide: è capire come, in pochi decenni, gli Egizi arrivarono a padroneggiare una forma che avrebbe definito per sempre l’immagine dell’Antico Regno.\n\nSe hai ancora in mente la Piramide Romboidale, confronta mentalmente le due sagome. Qui non c’è il cambio di angolo e tutto sembra più tranquillo, quasi inevitabile. In realtà questa semplicità è il risultato di tentativi precedenti. È uno dei motivi per cui Dahshur è così interessante: puoi vedere l’innovazione non come un’idea improvvisa, ma come un processo fatto di prove, correzioni e nuove soluzioni. Pochi siti permettono di leggere così chiaramente l’evoluzione di una forma architettonica soltanto spostandosi di qualche chilometro.", "observe": "Guarda la regolarità delle facce e, se entri, la progressione dei corridoi.", "photo": "All’esterno sfrutta tono della pietra e ombre; all’interno linee e simmetrie."}, {"id": "bab-zweila", "name": "Bab Zuweila", "en": "Bab Zuweila", "ar": "باب زويلة", "lat": 30.044, "lon": 31.258, "day": "2026-09-19", "area": "Cairo", "desc": "Porta monumentale del Cairo medievale", "img": "bab-zweila.jpg", "script": "Prima di passare sotto Bab Zuweila, fermati qualche metro davanti alla porta e guarda verso l’alto. Dopo il deserto delle necropoli, qui la storia cambia completamente scala: sei dentro una città che per secoli ha continuato a costruire sopra, accanto e attraverso i propri monumenti.\n\nBab Zuweila fu costruita nel 1092 come una delle porte meridionali della Cairo fatimide. Le due grandi torri semicircolari erano parte del sistema difensivo della città. Il passaggio centrale che vedi oggi era quindi un vero punto di controllo fra interno ed esterno.\n\nAlza ancora lo sguardo. I due minareti che dominano la porta appartengono alla moschea del sultano al-Mu’ayyad Shaykh, costruita più di tre secoli dopo. Le basi delle antiche torri furono riutilizzate per sostenere i minareti. In un solo colpo d’occhio hai quindi due epoche sovrapposte: fortificazione fatimide e architettura mamelucca.\n\nIl nome Zuweila deriva da una tribù nordafricana insediata in questa zona. La porta è legata anche a episodi molto più drammatici: nel 1517, dopo la conquista ottomana, qui fu giustiziato Tumanbay, ultimo sultano mamelucco d’Egitto.\n\nMa mentre cammini sotto l’arco, prova a non immaginare soltanto eventi politici. Pensa soprattutto al movimento quotidiano: mercanti, animali, soldati, pellegrini e residenti che attraversavano questo passaggio per entrare o uscire dalla città. È questa continuità d’uso a rendere Bab Zuweila diversa da un monumento isolato.\n\nUna volta oltre la porta, voltati indietro. Il rapporto fra torri, minareti, strada e folla restituisce meglio di qualsiasi data il carattere del Cairo storico: un luogo in cui le epoche non sono separate, ma letteralmente costruite una sopra l’altra.\n\nSe hai tempo e l’accesso è aperto, salire verso i livelli superiori cambia completamente la lettura della porta. Dall’alto la strada appare come un corridoio urbano e diventa più facile immaginare perché controllare questo punto fosse strategico. Anche senza salire, però, guarda il modo in cui il traffico pedonale moderno continua a passare sotto e attorno alla struttura. È forse il dettaglio più bello di Bab Zuweila: il monumento non è stato separato dalla città. La città continua a usarlo, attraversarlo e trasformarne continuamente il contesto.", "observe": "Guarda torri, pietra e stratificazione urbana attorno alla porta.", "photo": "Mostra il rapporto tra architettura monumentale e vita quotidiana."}, {"id": "al-azhar-park", "name": "Al-Azhar Park", "en": "Al-Azhar Park", "ar": "حديقة الأزهر", "lat": 30.042, "lon": 31.263, "day": "2026-09-19", "area": "Cairo", "desc": "Parco panoramico sul Cairo storico", "img": "al-azhar-park.jpg", "script": "Dopo vicoli, pietra e traffico, Al-Azhar Park è soprattutto un cambio di respiro. Non devi cercare un singolo monumento: il valore di questa tappa è la distanza che ti permette di prendere dalla città.\n\nCammina verso uno dei punti panoramici e guarda il profilo del Cairo storico. Da qui minareti, cupole e tetti smettono di essere edifici separati e diventano un paesaggio urbano continuo. Se la visibilità è buona, prova a riconoscere la Cittadella e poi lascia che lo sguardo torni verso i quartieri che hai appena attraversato.\n\nIl parco è relativamente recente rispetto a tutto ciò che lo circonda, ma il contrasto è proprio la sua forza. Vegetazione curata e spazi aperti si trovano accanto a una delle aree più dense e storicamente stratificate del Cairo.\n\nSe sei qui al tramonto, non avere fretta. La luce tende ad appiattirsi e poi a diventare più calda sui muri e sui minareti. È un buon momento per rivedere mentalmente la giornata: al mattino le necropoli di Saqqara e Dahshur, poi la città islamica e infine questo punto alto e verde.\n\nCerca anche i suoni. Da lontano il traffico diventa un fondo continuo, mentre richiami alla preghiera provenienti da direzioni diverse possono sovrapporsi. È un’esperienza molto diversa dalla quiete artificiale di un museo o da quella del deserto.\n\nPrima di andare via, concediti qualche minuto senza una meta precisa. Questa tappa non serve a “imparare” qualcosa in particolare. Serve a vedere il Cairo come insieme, a chiudere la giornata con un’immagine più larga e a lasciare spazio a quello che hai appena vissuto.", "observe": "Confronta il verde del parco con la densità del Cairo storico.", "photo": "Al tramonto cerca strati di tetti, minareti e luce calda."}]; const IMGS={}; const HIGHLIGHTS=[{"title": "Obelisco sospeso", "subtitle": "L’ingresso al GEM visto dal basso", "img": "gem-obelisk.jpg", "text": "Passa sotto il basamento e guarda la base dell’obelisco, le iscrizioni e il contrasto fra pietra antica e architettura contemporanea."}, {"title": "Ramses II e Grand Hall", "subtitle": "Il colosso che definisce la scala dell’ingresso", "img": "gem-ramesses.jpg", "text": "Osserva il colosso frontalmente e poi di profilo; usa le persone intorno per percepirne la scala monumentale."}, {"title": "Scalinata monumentale", "subtitle": "59 opere lungo una salita scenografica", "img": "gem-stairs.jpg", "text": "Fai poche soste: scegli una statua da vicino, poi voltati e leggi la sequenza delle opere nello spazio."}, {"title": "Gallerie principali", "subtitle": "Dodici sale fra regalità, società e credenze", "img": "gem-main.jpg", "text": "Non tentare di vedere tutto: usa i tre temi come bussola e scegli pochi reperti che ti attirano davvero."}, {"title": "Gallerie di Tutankhamon", "subtitle": "Oltre 5.000 oggetti dal corredo reale", "img": "gem-tutankhamun.jpg", "text": "Dopo i capolavori più celebri cerca gli oggetti quotidiani: mobili, sandali e piccoli oggetti rendono il faraone più concreto."}, {"title": "Barche di Cheope", "subtitle": "Il legno di Giza ricostruito a grandezza reale", "img": "gem-boats.jpg", "text": "Cammina lungo lo scafo per percepirne la lunghezza e poi cerca incastri, legature e la forte curvatura di prua e poppa."}];
const visited=new Set(JSON.parse(localStorage.getItem('viaggiaVisited')||'[]')); let current=null, map=null, userMarker=null, watchId=null, activePOI=null, mode='audio', utterance=null;
function save(){localStorage.setItem('viaggiaVisited',JSON.stringify([...visited]))}
function row(p){let v=visited.has(p.id);return `<div class="poirow" data-id="${p.id}"><div><b>${p.name}</b><span class="desc">${p.desc}</span></div><span class="pill ${v?'visited':''}">${v?'✓':'Apri'}</span></div>`}
function renderToday(){let d1=POIS.filter(p=>p.day==='2026-09-18'),d2=POIS.filter(p=>p.day==='2026-09-19');document.querySelector('#today').innerHTML=`<div class="card"><div class="daytitle">Venerdì 18 settembre</div><h2 style="margin:5px 0 8px">Giza + GEM + Nilo</h2>${d1.map(row).join('')}</div><div class="card"><div class="daytitle">Sabato 19 settembre</div><h2 style="margin:5px 0 8px">Saqqara + Dahshur + Cairo</h2>${d2.map(row).join('')}</div>`;bindRows()}
function renderExplore(q=''){let f=POIS.filter(p=>(p.name+' '+p.en+' '+p.ar+' '+p.area).toLowerCase().includes(q.toLowerCase()));document.querySelector('#exploreList').innerHTML=`<div class="card">${f.map(row).join('')}</div>`;bindRows()}
function bindRows(){document.querySelectorAll('.poirow').forEach(el=>el.onclick=()=>openPoi(el.dataset.id))}
function openPoi(id){activePOI=POIS.find(p=>p.id===id); if(!activePOI)return; document.querySelector('#dName').textContent=activePOI.name;document.querySelector('#dEn').textContent=activePOI.en;document.querySelector('#dAr').textContent=activePOI.ar; mode='audio';setMode('audio');updateVisit();document.querySelector('#detail').classList.add('open')}
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>{b.className='btn '+(b.dataset.mode===m?'':'secondary')});let text=m==='audio'?activePOI.script:(m==='observe'?activePOI.observe:activePOI.photo);document.querySelector('#section').textContent=text||'Contenuto non disponibile.'}
function updateVisit(){let v=visited.has(activePOI.id);let b=document.querySelector('#visitBtn');b.textContent=v?'✓ Visitato — annulla':'○ Segna visitato';b.className='btn '+(v?'secondary':'ghost')}
function speak(){if(!activePOI)return; if(speechSynthesis.speaking){speechSynthesis.resume();return} speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance(activePOI.script);utterance.lang='it-IT';utterance.rate=.86;let voices=speechSynthesis.getVoices();let pref=voices.find(v=>/Luca/i.test(v.name)&&/^it/i.test(v.lang))||voices.find(v=>/^it/i.test(v.lang));if(pref)utterance.voice=pref;utterance.onstart=()=>{document.querySelector('#audioBar').classList.add('show');document.querySelector('#now').textContent=activePOI.name;document.querySelector('#playPause').textContent='❚❚'};utterance.onend=()=>{document.querySelector('#playPause').textContent='▶︎'};speechSynthesis.speak(utterance)}
function initMap(){if(map||!window.L)return;map=L.map('leafmap').setView([29.93,31.17],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);POIS.forEach(p=>{let m=L.circleMarker([p.lat,p.lon],{radius:7,color:'#b97838',fillColor:'#c58b45',fillOpacity:.95,weight:2}).addTo(map);m.bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-5],className:'poi-label'});m.on('click',()=>openPoi(p.id))});setTimeout(()=>map.invalidateSize(),150)}
function distance(a,b,c,d){let R=6371000,ph1=a*Math.PI/180,ph2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;let x=Math.sin(dp/2)**2+Math.cos(ph1)*Math.cos(ph2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function gps(){if(!navigator.geolocation){document.querySelector('#gpsStatus').textContent='GPS non disponibile';return}document.querySelector('#gpsStatus').textContent='Richiesta posizione…';watchId=navigator.geolocation.watchPosition(pos=>{current=[pos.coords.latitude,pos.coords.longitude];let nearest=[...POIS].map(p=>[p,distance(current[0],current[1],p.lat,p.lon)]).sort((a,b)=>a[1]-b[1])[0];document.querySelector('#gpsStatus').textContent=`Più vicino: ${nearest[0].name} · ${Math.round(nearest[1])} m`;if(map){if(userMarker)userMarker.setLatLng(current);else userMarker=L.circleMarker(current,{radius:8,color:'#236c52',fillColor:'#40a17a',fillOpacity:1,weight:3}).addTo(map);map.setView(current,15)}},err=>{document.querySelector('#gpsStatus').textContent='GPS: '+err.message},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='map')initMap()});document.querySelector('#search').oninput=e=>renderExplore(e.target.value);document.querySelector('#back').onclick=()=>{speechSynthesis.pause();document.querySelector('#detail').classList.remove('open')};document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelector('#visitBtn').onclick=()=>{visited.has(activePOI.id)?visited.delete(activePOI.id):visited.add(activePOI.id);save();updateVisit();renderToday();renderExplore(document.querySelector('#search').value)};document.querySelector('#gpsBtn').onclick=gps;document.querySelector('#playPause').onclick=()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();document.querySelector('#playPause').textContent='▶︎'}else if(speechSynthesis.paused){speechSynthesis.resume();document.querySelector('#playPause').textContent='❚❚'}else speak()};document.querySelector('#stopAudio').onclick=()=>{speechSynthesis.cancel();document.querySelector('#audioBar').classList.remove('show')};document.querySelector('[data-mode="audio"]').ondblclick=speak;
// add explicit listen button above text in audio mode by tapping Ascolta when already selected
for(const b of document.querySelectorAll('.modes button')) b.addEventListener('click',()=>{if(b.dataset.mode==='audio') setTimeout(()=>{if(activePOI){let sec=document.querySelector('#section');if(!sec.querySelector('.listenStart')){let x=document.createElement('button');x.className='btn listenStart';x.textContent='▶ Ascolta audioguida';x.style.marginBottom='14px';x.onclick=speak;sec.prepend(x)}}},0)});
function renderHighlights(){let box=document.querySelector('#gemHighlights');box.innerHTML='<div class="daytitle">GEM · punti salienti</div>'+HIGHLIGHTS.map(h=>`<div class="card highlight"><h3>${h.title}</h3><small>${h.subtitle}</small><p>${h.text}</p></div>`).join('')}
renderToday();renderExplore();renderHighlights();speechSynthesis.onvoiceschanged=()=>{};
</script></body></html>
